# This is a working example.
# For a more complete reference use `--example`
kibot:
  version: 1

global:
  filters:
  - number: 1007
  - number: 1015
  - number: 58
  - number: 107

import:
- file: JLCPCB
  definitions:
    _KIBOT_MANF_DIR: Manufacturers/JLCPCB
    _KIBOT_POS_PRE_TRANSFORM: '[''_kicost_rename'', ''_rot_footprint'']'
    _KIBOT_BOM_ENABLED: 'false'

preflight:
  drc:
    dont_stop: true
    format: HTML,RPT,JSON,CSV
    dir: Generated
  erc:
    dont_stop: true
    format: HTML,RPT,JSON,CSV
    dir: Generated

outputs:
- name: basic_boardview
  comment: Board View export
  type: boardview
  dir: Generated/Assembly
- name: generic_bom_html
  comment: Generic Bill of Materials in HTML format
  type: bom
  dir: Generated/BoM/Generic
  options:
    format: HTML
    count_smd_tht: true
- name: generic_bom_csv
  comment: Generic Bill of Materials in CSV format
  type: bom
  dir: Generated/BoM/Generic
  options:
    format: CSV
    count_smd_tht: true
- name: generic_bom_hrtxt
  comment: Generic Bill of Materials in HRTXT format
  type: bom
  dir: Generated/BoM/Generic
  options:
    format: HRTXT
    hrtxt:
      separator: '|'
    count_smd_tht: true
- name: generic_bom_tsv
  comment: Generic Bill of Materials in TSV format
  type: bom
  dir: Generated/BoM/Generic
  options:
    format: TSV
    count_smd_tht: true
- name: generic_bom_xml
  comment: Generic Bill of Materials in XML format
  type: bom
  dir: Generated/BoM/Generic
  options:
    format: XML
    count_smd_tht: true
- name: generic_bom_xlsx
  comment: Generic Bill of Materials in XLSX format
  type: bom
  dir: Generated/BoM/Generic
  options:
    format: XLSX
    count_smd_tht: true
- name: positional_bom_html
  comment: Positional Bill of Materials in HTML format
  type: bom
  dir: Generated/BoM/Positional
  options:
    format: HTML
    columns: &id001
    - Row
    - Description
    - Part
    - Part Lib
    - References
    - Value
    - Footprint
    - Footprint Lib
    - Quantity Per PCB
    - Build Quantity
    - Status
    - Datasheet
    - Sheetpath
    - Source BoM
    - ${DNP}
    - ${EXCLUDE_FROM_BOARD}
    - ${EXCLUDE_FROM_SIM}
    - footprint full
    - Footprint X
    - Footprint Y
    - Footprint Rot
    - Footprint Side
    - Footprint Type
    - Footprint Type NV
    - Footprint Populate
    - Footprint X-Size
    - Footprint Y-Size
    - ${ITEM_NUMBER}
    - Net Name
    - Net Label
    - Net Class
    - ${QUANTITY}
    count_smd_tht: true
    html:
      style: modern-red
- name: positional_bom_xlsx
  comment: Positional Bill of Materials in XLSX format
  type: bom
  dir: Generated/BoM/Positional
  options:
    format: XLSX
    columns: *id001
    count_smd_tht: true
    xlsx:
      style: modern-red
- name: kicad_internal_bom
  type: bom
  dir: Generated/BoM/KiCad
  comment: BoM using KiCad settings
  options:
    format: KICAD
    ignore_dnf: false
    group_not_fitted: true
    group_fields: []
    sort_style: kicad_bom
    columns:
    - _kicad_bom_fields
- name: basic_excellon
  comment: Drill files in EXCELLON format
  type: excellon
  dir: Generated/Gerbers_and_Drill
  options:
    map: pdf
- name: basic_export_3d_step
  comment: 3D model in STEP format
  type: export_3d
  dir: Generated/3D
  options:
    format: step
- name: basic_export_3d_stl
  comment: 3D model in STL format
  type: export_3d
  dir: Generated/3D
  options:
    format: stl
- name: basic_info
  comment: Information about the run
  type: info
  dir: Generated/.
- name: basic_ipc2581
  comment: PCB in IPC-2581 format
  type: ipc2581
  dir: Generated/Export
- name: basic_kicanvas
  comment: Web page to browse the schematic and/or PCB
  type: kicanvas
  dir: Generated/Browse
  options:
    source:
    - schematic
    - pcb
- name: basic_kikit_present
  comment: Simple project presentation
  type: kikit_present
  dir: Generated/Presentation
  options:
    description: '# Presentation for rjsplitter

      This is an automatically generated presentation page'
    boards:
      mode: local
      comment: Resources included
      front_image: renderer_for_present
      back_image: renderer_for_present
      gerbers: gerbers_for_present
- name: renderer_for_present
  comment: Renderer for the presentation
  type: pcbdraw
  dir: Generated/Render_for_presentation
  run_by_default: false
- name: gerbers_for_present
  comment: Gerbers for the presentation
  type: gerber
  dir: Generated/Gerber_for_presentation
  layers: copper
  run_by_default: false
- name: basic_navigate_results_rb
  comment: Web page to browse the results
  type: navigate_results_rb
  dir: Generated/Browse
  options:
    link_from_root: Generated/index.html
    skip_not_run: true
- name: classic_netlist
  comment: Schematic netlist in KiCad format
  type: netlist
  dir: Generated/Export
- name: ipc_netlist
  comment: IPC-D-356 netlist for testing
  type: netlist
  dir: Generated/Export
  options:
    format: ipc
- name: basic_odb
  comment: PCB in ODB++ format
  type: odb
  dir: Generated/Export
- name: basic_pcb_print_pdf
  comment: PCB
  type: pcb_print
  dir: Generated/PCB/PDF
  options:
    format: PDF
    pages:
    - layers:
      - layer: F.Cu
      - layer: F.Mask
        color: '#14332440'
      - layer: F.Silkscreen
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front copper
    - layers:
      - layer: F.Mask
        color: '#14332440'
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front soldermask (negative)
    - layers:
      - layer: B.Cu
      - layer: B.Mask
        color: '#14332440'
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      mirror: true
      sheet: Bottom copper
    - layers:
      - layer: F.Courtyard
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front courtyard area
    - layers:
      - layer: F.Fab
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front documentation
    - repeat_for_layer: User.Drawings
      repeat_layers: drill_pairs
      layers:
      - layer: User.Drawings
        color: '#000000'
      - layer: Edge.Cuts
        color: '#000000'
    keep_temporal_files: true
- name: basic_pcb_print_png
  comment: PCB
  type: pcb_print
  dir: Generated/PCB/PNG
  options:
    format: PNG
    pages:
    - layers:
      - layer: F.Cu
      - layer: F.Mask
        color: '#14332440'
      - layer: F.Silkscreen
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front copper
    - layers:
      - layer: F.Mask
        color: '#14332440'
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front soldermask (negative)
    - layers:
      - layer: B.Cu
      - layer: B.Mask
        color: '#14332440'
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      mirror: true
      sheet: Bottom copper
    - layers:
      - layer: F.Courtyard
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front courtyard area
    - layers:
      - layer: F.Fab
      - layer: Edge.Cuts
      - layer: User.Comments
      - layer: User.2
      - layer: User.4
      - layer: User.6
      sheet: Front documentation
    - repeat_for_layer: User.Drawings
      repeat_layers: drill_pairs
      layers:
      - layer: User.Drawings
        color: '#000000'
      - layer: Edge.Cuts
        color: '#000000'
    keep_temporal_files: true
    add_background: true
- name: basic_pcbdraw_svg_jlcpcb_green_enig_top
  comment: PCB 2D render in SVG format, using jlcpcb-green-enig style
  type: pcbdraw
  dir: Generated/PCB/2D_render/jlcpcb_green_enig
  options:
    style: jlcpcb-green-enig
    format: svg
- name: basic_pcbdraw_png_jlcpcb_green_enig_top
  comment: PCB 2D render in PNG format, using jlcpcb-green-enig style
  type: pcbdraw
  dir: Generated/PCB/2D_render/jlcpcb_green_enig
  options:
    style: jlcpcb-green-enig
    format: png
- name: basic_pcbdraw_jpg_jlcpcb_green_enig_top
  comment: PCB 2D render in JPG format, using jlcpcb-green-enig style
  type: pcbdraw
  dir: Generated/PCB/2D_render/jlcpcb_green_enig
  options:
    style: jlcpcb-green-enig
    format: jpg
- name: basic_pcbdraw_svg_set_blue_enig_top
  comment: PCB 2D render in SVG format, using set-blue-enig style
  type: pcbdraw
  dir: Generated/PCB/2D_render/set_blue_enig
  options:
    style: set-blue-enig
