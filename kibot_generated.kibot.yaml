- name: basic_pdf_sch_print
  comment: Schematic in PDF format
  type: pdf_sch_print
  dir: Generated/Schematic
- name: basic_position_ASCII
  comment: Components position for Pick & Place
  type: position
  dir: Generated/Position
  options:
    format: ASCII
    only_smd: false
    separate_files_for_front_and_back: false
- name: basic_position_CSV
  comment: Components position for Pick & Place
  type: position
  dir: Generated/Position
  options:
    format: CSV
    only_smd: false
    separate_files_for_front_and_back: false
- name: basic_qr_lib_example
  comment: QR code symbol and footprint example
  type: qr_lib
  dir: Generated/QR_libs
  options:
    qrs:
    - correction_level: medium
      name: QR_data
      pcb_negative: true
    - correction_level: medium
      name: QR_kibot
      text: https://github.com/INTI-CMNB/KiBot/
    use_sch_dir: false
- name: basic_render_3d_top
  comment: 3D view from top
  type: render_3d
  dir: Generated/3D
  options:
    ray_tracing: true
    orthographic: true
- name: basic_render_3d_30deg
  comment: 3D view from 30 degrees
  type: render_3d
  dir: Generated/3D
  output_id: 30deg
  options:
    ray_tracing: true
    rotate_x: 3
    rotate_z: -2
- name: basic_render_3d_bottom
  comment: 3D view from bottom
  type: render_3d
  dir: Generated/3D
  options:
    ray_tracing: true
    orthographic: true
    view: bottom
- name: report_full
  comment: Full design report
  type: report
  options:
    template: full_SVG
- name: basic_vrml
  comment: PCB in VRML format
  type: vrml
  dir: Generated/3D

...
definitions:
  _KIBOT_MANF_DIR_COMP: Manufacturers
  _KIBOT_GERBER_LAYERS: "- layer: 'F.Cu'\n        suffix: 'F_Cu'\n        description:\
    \ 'Front copper'\n      - layer: 'F.Mask'\n        suffix: 'F_Mask'\n        description:\
    \ 'Front soldermask (negative)'\n      - layer: 'B.Cu'\n        suffix: 'B_Cu'\n\
    \        description: 'Bottom copper'\n      - layer: 'B.Mask'\n        suffix:\
    \ 'B_Mask'\n        description: 'Bottom soldermask (negative)'\n      - layer:\
    \ 'F.Silkscreen'\n        suffix: 'F_Silkscreen'\n        description: 'Front\
    \ silkscreen (artwork)'\n      - layer: 'Edge.Cuts'\n        suffix: 'Edge_Cuts'\n\
    \        description: 'Board shape'"
